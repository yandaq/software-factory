[project]
name = "sf"
version = "0.1.0"
description = "Software factory orchestrator driving Pi, Claude Code, or Codex"
authors = [
    { name = "yandaq", email = "ian@solutioneers.co.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
sf = "sf.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
