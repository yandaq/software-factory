<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sf runs</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
  --accent: #2f5bd3; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --chip: #efefea;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --text: #ececea; --muted: #9a9a94; --line: #33332f;
          --accent: #7fa0ff; --ok: #4cc382; --warn: #e0a84a; --bad: #f07070; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
.layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
aside h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.run { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.run:hover, .run.sel { background: var(--chip); }
.run .id { font-family: var(--mono); font-size: 13px; }
.run .meta { color: var(--muted); font-size: 12px; }
.run { position: relative; }
.run .del { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted);
            cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 4px; }
.run .del:hover { color: var(--bad); background: var(--panel); }
.run .retro { margin-top: 8px; font-size: 12px; padding: 2px 12px; }
main { padding: 20px; min-width: 0; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: rgb(0 0 0 / 0.25); z-index: 10; }
#loading[hidden] { display: none; }
#loading .spin { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--accent);
                 border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
.status { font-weight: 600; }
.s-running { color: var(--accent); } .s-done { color: var(--ok); }
.s-failed, .s-unreadable { color: var(--bad); } .s-aborted { color: var(--warn); }
.stages { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; }
.stage.done { background: var(--ok); color: #fff; }
.stage.current { outline: 2px solid var(--accent); }
.stage.current.failed { outline-color: var(--bad); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid section { margin-bottom: 0; }
.log { font-family: var(--mono); font-size: 12px; max-height: 340px; overflow: auto; }
.log div { padding: 2px 0; border-bottom: 1px dashed var(--line); word-break: break-word; }
button, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.documents { display: flex; flex-wrap: wrap; gap: 8px; }
.document { font-family: var(--mono); font-size: 12px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
dialog { width: min(900px, 95vw); max-height: 90vh; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; }
dialog::backdrop { background: #0008; }
dialog h2 { margin-top: 0; font-size: 18px; text-transform: none; overflow-wrap: anywhere; }
textarea { width: 100%; height: 55vh; resize: vertical; font: 13px/1.5 var(--mono); }
.editor-actions .danger { color: var(--bad); margin-right: auto; }
.editor-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.muted { color: var(--muted); }
a.art { color: var(--accent); cursor: pointer; margin-right: 12px; display: inline-block; font-family: var(--mono); font-size: 12px; }
pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; background: var(--chip); padding: 12px; border-radius: 6px; max-height: 480px; overflow: auto; margin: 10px 0 0; }
.err { color: var(--bad); }
.timeline svg { display: block; width: 100%; }
.timeline text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
.timeline .lane-label { fill: var(--text); font-size: 12px; }
.timeline line { stroke: var(--line); }
.timeline .ctx-line { fill: none; stroke-width: 2; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; max-height: 40vh; }
  main { padding: 16px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="loading" hidden role="status" aria-label="Loading run"><div class="spin"></div></div>
<div class="layout">
  <aside><h1>Software factory runs <a href="/config" style="float:right;font-weight:400;font-size:13px;color:var(--accent)">config</a></h1><div id="runs"></div></aside>
  <main id="main"><p class="muted">Select a run.</p></main>
</div>
<dialog id="editor" aria-labelledby="editor-title">
  <h2 id="editor-title"></h2>
  <p class="muted">Changes are saved to the project document.</p>
  <textarea id="editor-content" aria-label="Project Markdown" spellcheck="false" disabled></textarea>
  <p id="editor-status" role="status"></p>
  <div class="editor-actions"><button id="editor-delete" class="danger" disabled hidden>Delete file</button><button id="editor-cancel">Cancel</button><button id="editor-save" disabled>Save file</button></div>
</dialog>
<script>
// Display names for stages whose internal name reads badly on the dashboard.
const STAGE_LABELS = {branch: "sf"};
const stageLabel = st => STAGE_LABELS[st] || st;
const STAGES = ["branch", "prompt", "plan", "implement", "document", "merge", "improve"];
let selected = location.hash.slice(1) || null;
let openArtefact = null;
let documentMessage = "";
let rendered = null;  // run id currently drawn in #main; the spinner shows only while switching runs
const loading = on => { document.getElementById("loading").hidden = !on; };
const LANE_COLOURS = ["#2f5bd3", "#1f8a4c", "#c53030", "#b7791f", "#7b3fc4", "#0f8a8a", "#d4489a", "#5f6b2a"];
// A "running" run whose event log has gone quiet this long is treated as dead (e.g. a crashed orchestrator).
const STALE_MS = 5 * 60 * 1000;
const LANE_H = 34, LABEL_W = 170, AXIS_H = 22, DOT_R = 5, CTX_H = 120;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const money = c => "$" + (c || 0).toFixed(4);
function metric(u, key) {
  const known = u.known || ["input", "output", "cache_read", "cache_write", "cost"];
  const missing = (u.unavailable || []).includes(key);
  if (missing && !known.includes(key)) return "N/A";
  const value = key === "cost" ? money(u[key]) : String(u[key] || 0);
  return value + (missing ? " (partial)" : "") + (key === "cost" && u.estimated ? " (est.)" : "");
}
const time = ts => ts ? new Date(ts).toLocaleTimeString() : "";

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}

async function refreshRuns() {
  const runs = await getJSON("/api/runs");
  if (!selected && runs.length) selected = runs[0].run_id;
  document.getElementById("runs").innerHTML = runs.map(r => `
    <div class="run ${r.run_id === selected ? "sel" : ""}" data-id="${esc(r.run_id)}">
      <button class="del" title="Delete run ${esc(r.run_id)}" aria-label="Delete run">🗑</button>
      <div class="id">${esc(r.run_id)}</div>
      <div class="meta"><span class="status s-${esc(r.status)}">${esc(r.status)}</span>
        · ${esc(stageLabel(r.stage))}${r.loop ? " #" + r.loop : ""} · ${r.cost == null ? "N/A" : money(r.cost) + (r.cost_partial ? " (partial)" : "") + (r.cost_estimated ? " (est.)" : "")}</div>
      <button class="retro"${r.can_retro && r.status !== "running" ? "" : " disabled"}
        title="${esc(retroHint(r))}">retro</button>
    </div>`).join("") || `<p class="muted" style="padding:16px">No runs yet.</p>`;
}

// A retro re-runs the improvement agent over a finished run; only a merged run has code for it to study.
const retroHint = r => r.status === "running" ? "This run is busy; wait for it to finish"
  : r.can_retro ? "Re-run the improvement agent on this run's logs and merged code: suggestions only, nothing is applied"
  : "Available once the run has merged";

function tokenRows(tokens) {
  const rows = [
    ...Object.entries(tokens.by_stage || {}).map(([k, v]) => ["stage " + k, v]),
    ...Object.entries(tokens.by_loop || {}).map(([k, v]) => ["loop " + k, v]),
    ["run", tokens.run || {}],
  ];
  return rows.map(([name, u]) => `<tr><td>${esc(name)}</td>${["input", "output", "cache_read", "cache_write", "cost"]
    .map(key => `<td class="n">${metric(u, key)}</td>`).join("")}</tr>`).join("");
}

function loopRows(state) {
  const loops = [];
  for (let n = 1; n <= state.loop; n++) {
    loops.push(`<tr><td>${n}</td><td>${esc(state.results["validation-" + n] || "—")}</td>
      <td>${esc(state.results["review-" + n] || "—")}</td></tr>`);
  }
  return loops.join("") || `<tr><td colspan="3" class="muted">No loops yet.</td></tr>`;
}

function eventLine(e) {
  const {ts, run_id, stage, loop, source, type, ...rest} = e;
  const detail = Object.keys(rest).length ? " " + esc(JSON.stringify(rest)) : "";
  const cls = /fail|violation|invalid|abort/.test(type) || rest.failure ? "err" : "";
  return `<div class="${cls}"><span class="muted">${time(ts)} ${esc(stage)}#${loop}</span> <b>${esc(type)}</b>${detail}</div>`;
}

function toolLine(e) {
  const ev = e.event;
  return `<div><span class="muted">${time(e.ts)} ${esc(e.stage)}#${e.loop} ${esc(e.agent)}</span>
    <b>${esc(ev.toolName)}</b> ${esc(JSON.stringify(ev.args).slice(0, 160))}</div>`;
}

function niceStep(span) {
  for (const s of [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600]) if (span / s <= 8) return s;
  return 7200;
}

function fmtSecs(t) {
  return t < 60 ? `${t}s` : t % 60 ? `${Math.floor(t / 60)}m${t % 60}s` : `${t / 60}m`;
}

const kTokens = n => n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n);

// Swimlane chart: one lane per agent plus "sf" for the orchestrator, one dot per event, x = seconds since run start.
// Below the lanes, one line per agent invocation plots its context size (tokens) after each assistant turn.
// While the run is live the axis extends to "now", so it autoscales as time passes.
function timelineSvg(points, live, agents) {
  if (!points.length) return '<p class="muted">No events yet.</p>';
  const width = Math.max(document.getElementById("main").clientWidth - 72, 300);
  const t0 = Date.parse(points[0][0]);
  const lanes = [...new Set(points.map(p => p[1]))];
  const colour = lane => LANE_COLOURS[lanes.indexOf(lane) % LANE_COLOURS.length];
  const end = live ? Date.now() : Date.parse(points[points.length - 1][0]);
  const span = Math.max((end - t0) / 1000, 1);
  const plotW = width - LABEL_W - DOT_R * 2;
  const secsOf = ts => (Date.parse(ts) - t0) / 1000;
  const x = secs => LABEL_W + DOT_R + (secs / span) * plotW;
  const ctx = points.filter(p => p[3] != null);
  const ctxMax = Math.max(...ctx.map(p => p[3]), 1);
  const lanesH = lanes.length * LANE_H;
  const plotH = lanesH + (ctx.length ? CTX_H : 0);
  const height = plotH + AXIS_H;
  const latest = {};
  for (const [, lane, , tokens] of ctx) latest[lane] = tokens;
  const step = niceStep(span);
  let ticks = "";
  for (let t = 0; t <= span; t += step) {
    ticks += `<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${plotH}"/>
      <text x="${x(t)}" y="${height - 6}" text-anchor="middle">${fmtSecs(t)}</text>`;
  }
  const rows = lanes.map((lane, i) => `<line x1="${LABEL_W}" x2="${width}" y1="${(i + 1) * LANE_H}" y2="${(i + 1) * LANE_H}"/>
    <text class="lane-label" x="0" y="${i * LANE_H + (agents[lane] ? 14 : LANE_H / 2 + 4)}">${esc(lane)}${lane in latest
      ? ` <tspan class="muted">${kTokens(latest[lane])}</tspan>` : ""}</text>${agents[lane] ? agentModel(agents[lane], i) : ""}`).join("");
  const dots = points.map(([ts, lane, type, tokens]) => {
    const secs = secsOf(ts);
    const cx = x(secs), cy = lanes.indexOf(lane) * LANE_H + LANE_H / 2;
    const title = `<title>${esc(lane)} · ${esc(type)} · ${secs.toFixed(1)}s${tokens != null
      ? ` · context ${tokens} tokens` : ""}</title>`;
    // Git actions (git_commit, git_checkout, git_merge) are squares so they stand out on the sf lane.
    if (type.startsWith("git_")) return `<rect x="${cx - DOT_R}" y="${cy - DOT_R}" width="${DOT_R * 2}" height="${DOT_R * 2}"
      fill="${colour(lane)}">${title}</rect>`;
    return `<circle cx="${cx}" cy="${cy}" r="${DOT_R}" fill="${colour(lane)}" fill-opacity="0.75">${title}</circle>`;
  }).join("");
  let context = "";
  if (ctx.length) {
    const y = tokens => plotH - 6 - (tokens / ctxMax) * (CTX_H - 16);
    context = `<text class="lane-label" x="0" y="${lanesH + 18}">context</text>
      <text x="0" y="${lanesH + 34}">max ${kTokens(ctxMax)}</text>`;
    // One line per agent invocation: each invocation starts with a fresh context.
    const runs = {};
    for (const p of ctx) (runs[p[1] + "#" + p[4]] ??= []).push(p);
    for (const pts of Object.values(runs)) {
      const coords = pts.map(p => `${x(secsOf(p[0]))},${y(p[3])}`).join(" ");
      context += `<polyline class="ctx-line" points="${coords}" stroke="${colour(pts[0][1])}"/>`;
    }
  }
  return `<svg width="${width}" height="${height}" role="img" aria-label="Agent activity timeline">${ticks}${rows}${dots}${context}</svg>`;
}

// Model and thinking effort under an agent's lane label, the model's provider prefix dropped to fit.
function agentModel({harness, model, thinking}, i) {
  const label = {pi: "Pi", "claude-code": "Claude Code", codex: "Codex"}[harness || "pi"];
  const full = `${label} · ${model} · ${thinking}`;
  let short = `${label} · ${(model || "?").split("/").pop()} · ${thinking || "?"}`;
  if (short.length > 28) short = short.slice(0, 27) + "…";
  return `<text x="0" y="${i * LANE_H + 28}"><title>${esc(full)}</title>${esc(short)}</text>`;
}

async function refreshDetail() {
  const main = document.getElementById("main");
  if (!selected) return;
  const id = selected;
  if (id !== rendered) loading(true);
  const d = await getJSON("/api/runs/" + encodeURIComponent(id));
  if (id !== selected) return;  // the user picked another run while this one loaded
  const s = d.state;
  const stages = STAGES.map(st => {
    const cls = s.completed.includes(st) ? "done" : st === s.stage ? `current ${s.status}` : "";
    return `<span class="stage ${cls}" title="${esc(s.results[st] || "")}">${stageLabel(st)}</span>`;
  }).join("");
  const results = STAGES.filter(st => s.results[st])
    .map(st => `<tr><td>${stageLabel(st)}</td><td>${esc(s.results[st])}</td></tr>`).join("");
  main.innerHTML = `
    <section>
      <h2>Run ${esc(s.run_id)}</h2>
      <p><span class="status s-${esc(s.status)}">${esc(s.status)}</span> · stage <b>${esc(s.stage)}</b>
        · loop ${s.loop}/${s.max_loops}${s.cap_reached ? ' · <span class="err">loop cap reached</span>' : ""}</p>
      <p class="muted">${esc(s.target)} · ${esc(s.branch)} → ${esc(s.trunk)}</p>
      <div class="stages">${stages}</div>
    </section>
    <section class="timeline"><h2>Activity</h2><p class="muted">Context is plotted only when reported by the harness.</p>${timelineSvg(d.timeline,
      s.status === "running" && Date.now() - d.events_updated * 1000 < STALE_MS, d.agents)}</section>
    <section id="project-documents"><h2>Project documents</h2>
      ${d.documents_error ? `<p class="err">${esc(d.documents_error)}</p>` :
        (d.documents || []).length ? `<div class="documents">${d.documents.map(path =>
          `<button class="document" data-path="${esc(path)}">${esc(path)}</button>`).join("")}</div>` :
          '<p class="muted">No Markdown documents found.</p>'}
      <p id="document-message" role="status">${esc(documentMessage)}</p>
    </section>
    <div class="grid">
      <section><h2>Stage results</h2><table>${results || '<tr><td class="muted">None yet.</td></tr>'}</table></section>
      <section><h2>Loops</h2><table><tr><th>#</th><th>Validation</th><th>Review</th></tr>${loopRows(s)}</table></section>
    </div>
    <section style="margin-top:16px"><h2>Tokens</h2><div style="overflow-x:auto"><table>
      <tr><th>Scope</th><th class="n">Input</th><th class="n">Output</th><th class="n">Cache read</th>
      <th class="n">Cache write</th><th class="n">Cost</th></tr>${tokenRows(s.tokens || {})}</table></div></section>
    <section><h2>Artefacts</h2>${d.artefacts.map(a => `<a class="art" data-name="${esc(a)}">${esc(a)}</a>`).join("")}
      <pre id="art" ${openArtefact ? "" : "hidden"}></pre></section>
    <div class="grid">
      <section><h2>Orchestrator events</h2><div class="log" id="ev">${d.events.slice().reverse().map(eventLine).join("")}</div></section>
      <section><h2>Tool calls</h2><div class="log">${d.tools.slice().reverse().map(toolLine).join("")}</div></section>
    </div>`;
  rendered = id;
  loading(false);
  if (openArtefact) showArtefact(openArtefact);
}

async function showArtefact(name) {
  openArtefact = name;
  const r = await fetch(`/api/runs/${encodeURIComponent(selected)}/${encodeURIComponent(name)}`);
  const pre = document.getElementById("art");
  pre.hidden = false;
  pre.textContent = r.ok ? await r.text() : `Could not load ${name}: HTTP ${r.status}`;
}

const editor = document.getElementById("editor");
const content = document.getElementById("editor-content");
const editorStatus = document.getElementById("editor-status");
const saveFile = document.getElementById("editor-save");
const cancel = document.getElementById("editor-cancel");
const deleteFile = document.getElementById("editor-delete");
let editingUrl, editingRun, editingPath, original = "", saving = false, deletable = false, editorRequest = 0;

cancel.addEventListener("click", () => editor.close());
editor.addEventListener("cancel", e => { if (saving) e.preventDefault(); });
content.addEventListener("input", () => { saveFile.disabled = content.value === original; });

async function editDocument(path) {
  const request = ++editorRequest;
  editingRun = selected; editingPath = path;
  editingUrl = `/api/runs/${encodeURIComponent(editingRun)}/document?path=${encodeURIComponent(path)}`;
  document.getElementById("editor-title").textContent = path;
  content.value = ""; content.disabled = true; saveFile.disabled = true;
  deletable = false; deleteFile.disabled = true; deleteFile.hidden = true;
  editorStatus.className = "muted"; editorStatus.textContent = "Loading…";
  editor.showModal();
  try {
    const r = await fetch(editingUrl);
    const data = await r.json();
    if (request !== editorRequest || !editor.open) return;
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    original = data.content; content.value = original; content.disabled = false;
    deletable = data.deletable === true; deleteFile.hidden = !deletable; deleteFile.disabled = !deletable;
    editorStatus.textContent = ""; content.focus();
  } catch (err) {
    if (request === editorRequest && editor.open) {
      editorStatus.className = "err"; editorStatus.textContent = err.message;
    }
  }
}

saveFile.addEventListener("click", async () => {
  saving = true; saveFile.disabled = true; deleteFile.disabled = true; cancel.disabled = true; content.disabled = true;
  try {
    const r = await fetch(editingUrl, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content: content.value, original}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    original = content.value;
    if (selected === editingRun) {
      documentMessage = `Saved ${editingPath}`;
      const message = document.getElementById("document-message");
      if (message) message.textContent = documentMessage;
    }
    editor.close();
  } catch (err) {
    editorStatus.className = "err"; editorStatus.textContent = err.message;
  } finally {
    saving = false; cancel.disabled = false; content.disabled = false;
    saveFile.disabled = content.value === original; deleteFile.disabled = !deletable;
  }
});

deleteFile.addEventListener("click", async () => {
  if (saving || !deletable || content.disabled) return;
  if (!confirm(`Delete ${editingPath}? This removes the project document and discards any unsaved edits.`)) return;
  saving = true; saveFile.disabled = true; deleteFile.disabled = true; cancel.disabled = true; content.disabled = true;
  try {
    const r = await fetch(editingUrl, {
      method: "DELETE", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({original}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    if (selected === editingRun) {
      documentMessage = `Deleted ${editingPath}`;
      const message = document.getElementById("document-message");
      if (message) message.textContent = documentMessage;
      for (const button of document.querySelectorAll(".document")) {
        if (button.dataset.path === editingPath) button.remove();
      }
    }
    editor.close();
    void tick();
  } catch (err) {
    editorStatus.className = "err"; editorStatus.textContent = err.message;
  } finally {
    saving = false; cancel.disabled = false; content.disabled = false;
    saveFile.disabled = content.value === original; deleteFile.disabled = !deletable;
  }
});

// The improvement agent runs as a child process; the next poll shows its stage, events and result.
async function startRetro(button) {
  const id = button.closest(".run").dataset.id;
  button.disabled = true;
  try {
    const r = await fetch(`/api/runs/${encodeURIComponent(id)}/retro`, {method: "POST"});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `retro ${id}: HTTP ${r.status}`);
    selected = id; openArtefact = null; documentMessage = ""; location.hash = id;
    tick();
  } catch (err) {
    console.error(err);
    alert(err.message);
    button.disabled = false;
  }
}

async function deleteRun(id) {
  if (!confirm(`Delete run ${id} and all its files? This cannot be undone.`)) return;
  const r = await fetch("/api/runs/" + encodeURIComponent(id), {method: "DELETE"});
  if (!r.ok) throw new Error(`delete ${id}: HTTP ${r.status}`);
  if (selected === id) { selected = null; rendered = null; openArtefact = null; documentMessage = ""; location.hash = "";
    document.getElementById("main").innerHTML = '<p class="muted">Select a run.</p>'; }
  tick();
}

document.addEventListener("click", e => {
  const del = e.target.closest(".del");
  if (del) return void deleteRun(del.closest(".run").dataset.id).catch(err => {
    console.error(err); alert(err.message); });
  const retro = e.target.closest(".retro");
  if (retro) return void startRetro(retro);
  const doc = e.target.closest(".document");
  if (doc) return void editDocument(doc.dataset.path);
  const run = e.target.closest(".run");
  if (run) { selected = run.dataset.id; openArtefact = null; documentMessage = ""; location.hash = selected;
    if (selected !== rendered) loading(true); tick(); }
  const art = e.target.closest(".art");
  if (art && art.dataset.name === openArtefact) {
    openArtefact = null;
    document.getElementById("art").hidden = true;
  } else if (art) {
    showArtefact(art.dataset.name).catch(err => console.error(err));
  }
});

// Large runs can take longer than the refresh interval to load; overlapping ticks would render out of order.
let ticking = false;
async function tick() {
  if (ticking) return;
  ticking = true;
  try { await refreshRuns(); await refreshDetail(); }
  catch (err) { console.error(err); loading(false); document.getElementById("main").insertAdjacentHTML("afterbegin",
    `<p class="err">Refresh failed: ${esc(err.message)}</p>`); }
  finally { ticking = false; }
}
tick();
setInterval(tick, 2000);
</script>
